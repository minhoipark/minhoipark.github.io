<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="url(#bg1)" />
  <circle cx="200" cy="200" r="170" fill="none" stroke="#0f3460" stroke-width="2" opacity="0.5" />

  <!-- Grid lines (digital/cyber feel) -->
  <g opacity="0.15" stroke="#4fc3f7" stroke-width="0.5">
    <line x1="60" y1="80" x2="340" y2="80" />
    <line x1="60" y1="140" x2="340" y2="140" />
    <line x1="60" y1="200" x2="340" y2="200" />
    <line x1="60" y1="260" x2="340" y2="260" />
    <line x1="60" y1="320" x2="340" y2="320" />
    <line x1="100" y1="40" x2="100" y2="360" />
    <line x1="160" y1="40" x2="160" y2="360" />
    <line x1="220" y1="40" x2="220" y2="360" />
    <line x1="280" y1="40" x2="280" y2="360" />
  </g>

  <!-- Shield shape -->
  <path d="M200 100 L280 140 L280 220 C280 280 200 320 200 320 C200 320 120 280 120 220 L120 140 Z"
        fill="url(#accent1)" opacity="0.8" stroke="#4fc3f7" stroke-width="2"/>

  <!-- Magnifying glass -->
  <circle cx="190" cy="200" r="40" fill="none" stroke="#e94560" stroke-width="5" opacity="0.9"/>
  <line x1="220" y1="228" x2="255" y2="263" stroke="#e94560" stroke-width="5" stroke-linecap="round" opacity="0.9"/>

  <!-- Binary code decorations -->
  <g fill="#4fc3f7" font-family="monospace" font-size="11" opacity="0.4">
    <text x="70" y="105">01101</text>
    <text x="280" y="105">10011</text>
    <text x="65" y="300">11010</text>
    <text x="285" y="300">01100</text>
    <text x="155" y="70">1010110</text>
    <text x="155" y="355">0110101</text>
  </g>

  <!-- Data nodes -->
  <circle cx="130" cy="160" r="5" fill="#e94560" opacity="0.7"/>
  <circle cx="270" cy="160" r="5" fill="#e94560" opacity="0.7"/>
  <circle cx="130" cy="260" r="5" fill="#4fc3f7" opacity="0.7"/>
  <circle cx="270" cy="260" r="5" fill="#4fc3f7" opacity="0.7"/>

  <!-- Connection lines -->
  <line x1="130" y1="160" x2="165" y2="185" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
  <line x1="270" y1="160" x2="220" y2="185" stroke="#e94560" stroke-width="1.5" opacity="0.4"/>
  <line x1="130" y1="260" x2="165" y2="220" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>
  <line x1="270" y1="260" x2="220" y2="220" stroke="#4fc3f7" stroke-width="1.5" opacity="0.4"/>

  <!-- Eye in magnifying glass (investigation) -->
  <ellipse cx="190" cy="200" rx="18" ry="12" fill="none" stroke="#4fc3f7" stroke-width="2" opacity="0.8"/>
  <circle cx="190" cy="200" r="6" fill="#4fc3f7" opacity="0.8"/>
</svg>
